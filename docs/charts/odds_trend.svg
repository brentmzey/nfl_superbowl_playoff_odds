  }
  .title{font-size:16px;font-weight:600} .sub{font-size:12px}
  text{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:12px}
  .num{font-variant-numeric:tabular-nums}
  .hover:hover{opacity:.82}
</style>
