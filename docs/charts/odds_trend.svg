<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 390" width="760" height="390" role="img" aria-label="Super Bowl odds over the season">
<style>
  .bg{fill:#fcfcfb} .t{fill:#0b0b0b} .t2{fill:#52514e} .m{fill:#898781}
  .grid{stroke:#e1e0d9;stroke-width:1} .axis{stroke:#c3c2b7;stroke-width:1} .ring{stroke:#fcfcfb;stroke-width:2}
  .pos{fill:#2a78d6} .neg{fill:#e34948} .on{fill:#ffffff} .s1{fill:#2a78d6} .l1{stroke:#2a78d6} .s2{fill:#eb6834} .l2{stroke:#eb6834} .s3{fill:#1baf7a} .l3{stroke:#1baf7a} .s4{fill:#eda100} .l4{stroke:#eda100} .s5{fill:#e87ba4} .l5{stroke:#e87ba4} .s6{fill:#008300} .l6{stroke:#008300}
  @media (prefers-color-scheme: dark){
    .bg{fill:#1a1a19} .t{fill:#ffffff} .t2{fill:#c3c2b7}
    .grid{stroke:#2c2c2a} .axis{stroke:#383835} .ring{stroke:#1a1a19}
